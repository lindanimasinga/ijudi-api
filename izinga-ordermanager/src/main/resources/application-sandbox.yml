# TIER-BILLING-01: Sandbox profile for PayFast subscription billing.
#
# Activated via: spring.profiles.active=sandbox
#
# This profile overrides payfast.subscription to point at sandbox.payfast.co.za.
# Sandbox merchant credentials (merchant-key and passphrase) are loaded from
# environment variables using the same pattern as production.
#
# AC-20 / RISK-05: merchant-key and passphrase MUST be set via environment variable or
# AWS Secrets Manager — never hardcode real values here.
#
# Sandbox account created at https://sandbox.payfast.co.za
# Sandbox Merchant ID: 10020746 (not secret — visible in payment form parameters)
payfast:
    subscription:
        merchant-id: "10020746"
        merchant-key: ${PAYFAST_SUBSCRIPTION_MERCHANT_KEY:REPLACE_WITH_SECRET_BEFORE_TESTING}
        passphrase: ${PAYFAST_SUBSCRIPTION_PASSPHRASE:REPLACE_WITH_SECRET_BEFORE_TESTING}
        base-url: https://sandbox.payfast.co.za/eng/process
        validate-url: https://sandbox.payfast.co.za/eng/query/validate
        return-url: https://biz.izinga.co.za/business/subscription-success
        cancel-url: https://biz.izinga.co.za/business/subscription-cancel
        notify-url: https://api.izinga.co.za/merchant/subscription/itn
